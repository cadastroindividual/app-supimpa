<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.O. SUPIMPA 2.0 - EDIÇÃO FRUTIGER AERO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.45); }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #d1f2fb 100%);
            background-attachment: fixed; color: #0b2e4d; min-height: 100vh;
        }
        .glossy {
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.1) 50%, rgba(0,0,0,0.05) 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .glass-card {
            background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 24px;
        }
        @keyframes glow-gold { 0%, 100% { box-shadow: 0 0 15px #ffd700; border-color: #ffd700; } 50% { box-shadow: 0 0 30px #ffd700; border-color: #fff; } }
        .card-f-mes { animation: glow-gold 2s infinite; border: 3px solid #ffd700 !important; background: rgba(255, 215, 0, 0.15) !important; }
        .welcome-msg { font-size: 10px; opacity: 0.9; font-weight: 800; text-transform: uppercase; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col">

    <section id="tela-login" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-blue-400/20 backdrop-blur-3xl">
        <div class="glass-card w-full max-w-md p-10 text-center space-y-6">
            <h2 class="text-3xl font-black italic text-blue-900 drop-shadow-sm">Faça o login para continuar</h2>
            <div class="space-y-4">
                <input type="text" id="login-user" placeholder="Usuário" class="w-full p-4 rounded-2xl glass-card outline-none font-bold">
                <input type="password" id="login-pass" placeholder="Senha" class="w-full p-4 rounded-2xl glass-card outline-none font-bold">
                <button onclick="realizarLogin()" class="glossy w-full bg-blue-600 text-white font-black py-4 rounded-2xl">ENTRAR</button>
            </div>
        </div>
    </section>

    <header id="main-header" class="hidden glossy bg-[#0054a6] text-white h-[50px] px-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <h1 class="text-lg font-black italic tracking-tighter">S.O ED. FRUTIGER AERO</h1>
            <i id="notif-feed-icon" data-lucide="bell" class="w-4 h-4 cursor-pointer" onclick="abrirFeed()"></i>
        </div>
        <div class="welcome-msg text-center truncate px-2">Bem-vindo(a), <span id="welcome-name">...</span></div>
        <div class="flex items-center gap-2 cursor-pointer" onclick="verMeuPerfil()">
            <div class="text-right hidden sm:block"><p id="nav-xp" class="text-[9px] font-black text-blue-200"></p></div>
            <div class="relative">
                <img id="nav-img" src="" class="w-8 h-8 rounded-full border border-white/50 object-cover bg-white/20">
                <div id="nav-status" class="w-3 h-3 rounded-full border-2 border-white absolute bottom-0 right-0"></div>
            </div>
        </div>
    </header>

    <main id="main-content" class="hidden flex-1 p-4 max-w-5xl mx-auto w-full space-y-6">
        
        <section id="tela-menu" class="space-y-6">
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-center uppercase text-[8px] font-black">
                <div onclick="abrirFeed()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="layout" class="mx-auto mb-1 text-purple-600 w-5 h-5"></i> Feed Social
                </div>
                <div onclick="abrirFerramentaCotação()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="calculator" class="mx-auto mb-1 text-blue-600 w-5 h-5"></i> Cotação
                </div>
                <div onclick="abrirFerramenta('https://www.hapvida.com.br/site/carencia', 'carencia')" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="shield-check" class="mx-auto mb-1 text-green-600 w-5 h-5"></i> Carência
                </div>
                <div onclick="abrirFerramenta('https://www.hapvida.com.br/site/repique', 'repique')" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="refresh-cw" class="mx-auto mb-1 text-orange-600 w-5 h-5"></i> Repique
                </div>
                <div onclick="tentarAcessoAdmin()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="lock" class="mx-auto mb-1 text-gray-700 w-5 h-5"></i> Admin
                </div>
            </div>

            <div class="glass-card p-5">
                <h3 class="font-black text-blue-900 mb-4 flex items-center gap-2 text-[10px] uppercase italic"><i data-lucide="award"></i> Ranking do Mês</h3>
                <div id="lista-equipe" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            </div>
        </section>

        <section id="tela-feed" class="hidden max-w-2xl mx-auto space-y-4 pb-20">
            <button onclick="abrirTela('tela-menu')" class="text-[9px] font-black uppercase text-blue-600">Voltar</button>
            <div class="glass-card p-4 space-y-3">
                <textarea id="feed-text" class="w-full bg-white/30 p-3 rounded-xl outline-none text-xs font-medium" placeholder="O que você está pensando?"></textarea>
                <div class="flex justify-between items-center">
                    <div class="flex gap-2">
                        <input type="file" id="feed-media" class="hidden" accept="image/*" onchange="previewMedia(this)">
                        <button onclick="document.getElementById('feed-media').click()" class="p-2 bg-white/40 rounded-lg text-blue-600"><i data-lucide="image" class="w-4 h-4"></i></button>
                    </div>
                    <button onclick="postarFeed()" class="glossy bg-blue-600 text-white px-6 py-2 rounded-xl font-black text-[10px] uppercase">PUBLICAR</button>
                </div>
                <div id="media-preview" class="hidden relative w-20 h-20 rounded-lg overflow-hidden border border-blue-200">
                    <img id="img-preview" src="" class="w-full h-full object-cover">
                    <button onclick="removerMedia()" class="absolute top-0 right-0 bg-red-500 text-white rounded-bl-lg p-1"><i data-lucide="x" class="w-3 h-3"></i></button>
                </div>
            </div>
            <div id="feed-posts" class="space-y-6"></div>
        </section>

        </main>

    <div id="modal-admin" class="hidden fixed inset-0 bg-blue-900/30 backdrop-blur-md z-[60] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm p-6 space-y-5">
            <h3 class="text-xl font-black text-blue-900 italic">Admin</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[9px] font-black text-blue-700 uppercase">Destaque: Funcionário do Mês</label>
                    <select id="adm-f-mes" class="w-full p-2 glass-card text-[10px] font-bold mt-1"></select>
                </div>
                <div>
                    <label class="text-[9px] font-black text-blue-700 uppercase">Conceder Honraria</label>
                    <div class="flex gap-2 mt-1">
                        <select id="adm-alvo" class="flex-1 p-2 glass-card text-[10px] font-bold"></select>
                        <select id="adm-selo" class="flex-1 p-2 glass-card text-[10px] font-bold"></select>
                    </div>
                </div>
                <button onclick="salvarAdmin()" class="glossy w-full bg-blue-600 text-white py-3 rounded-xl font-black uppercase text-[10px]">Salvar Configurações</button>
            </div>
            <button onclick="document.getElementById('modal-admin').classList.add('hidden')" class="w-full text-[9px] font-bold text-gray-400 uppercase">Fechar</button>
        </div>
    </div>

    <div id="modal-cotacao" class="hidden fixed inset-0 bg-white z-[100] overflow-y-auto">
        <div class="p-4 bg-blue-900 text-white flex justify-between items-center sticky top-0">
            <h2 class="font-black uppercase text-xs">Calculadora de Cotação</h2>
            <button onclick="document.getElementById('modal-cotacao').classList.add('hidden')" class="font-bold text-xs">FECHAR [X]</button>
        </div>
        <div id="conteudo-cotacao"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
