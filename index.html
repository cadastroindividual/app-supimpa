<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Supimpa 1.4 - Aero Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --fa-blue: #0078d7; --glass: rgba(255, 255, 255, 0.4); }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #d1f2fb 100%);
            background-attachment: fixed;
            color: #0b2e4d; min-height: 100vh;
        }
        .glossy {
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.2) 48%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.05) 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        }
        .card-menu { cursor: pointer; transition: all 0.3s ease; }
        .card-menu:hover { transform: translateY(-3px); background: rgba(255,255,255,0.6); }
        
        /* Borda Dourada Animada */
        .gold-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.6) !important;
            border: none !important;
            padding: 2px; /* Espaço para a borda aparecer */
            overflow: hidden;
        }
        .gold-card::before {
            content: '';
            position: absolute;
            z-index: -1;
            left: -50%; top: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, #ffd700, transparent);
            animation: rotate 4s linear infinite;
        }
        .gold-card-inner {
            background: rgba(255, 245, 200, 0.9);
            border-radius: 22px;
            padding: 1rem;
            height: 100%;
            width: 100%;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .profile-img-nav { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .post-img { max-height: 300px; width: 100%; object-fit: cover; border-radius: 15px; margin-top: 10px; }
        .hidden { display: none !important; }
        #pdf-template { position: absolute; left: -9999px; }
    </style>
</head>
<body>

    <section id="tela-login" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-blue-400/20 backdrop-blur-xl">
        <div class="glass-card w-full max-w-md p-10 text-center space-y-6">
            <h2 class="text-3xl font-black italic text-blue-900">Acesso Supimpa</h2>
            <div class="space-y-4">
                <input type="text" id="login-user" placeholder="Usuário" class="w-full p-4 rounded-2xl glass-card outline-none font-bold">
                <input type="password" id="login-pass" placeholder="Senha" class="w-full p-4 rounded-2xl glass-card outline-none font-bold">
                <button onclick="realizarLogin()" class="glossy w-full bg-blue-600 text-white font-black py-4 rounded-2xl">ENTRAR</button>
            </div>
        </div>
    </section>

    <header id="main-header" class="hidden glossy bg-[#0054a6] text-white py-3 px-6 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <i data-lucide="cloud-sun" class="text-blue-200"></i>
            <h1 class="text-xl font-black italic">Supimpa 1.4</h1>
        </div>
        <div class="flex items-center gap-3 cursor-pointer" onclick="abrirTela('tela-perfil')">
            <div class="text-right hidden md:block">
                <p id="nav-user-nome" class="text-[11px] font-black leading-none"></p>
                <p id="nav-user-cargo" class="text-[9px] font-bold opacity-70 uppercase"></p>
            </div>
            <img id="nav-user-img" src="https://via.placeholder.com/40" class="profile-img-nav bg-white/30">
        </div>
    </header>

    <main id="main-content" class="hidden max-w-6xl mx-auto p-4 space-y-6">
        
        <section id="tela-menu" class="space-y-6">
            <div class="grid grid-cols-2 md:grid-cols-6 gap-3 text-center uppercase text-[9px] font-black">
                <div onclick="abrirTela('tela-feed')" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-purple-400/30 p-3 rounded-full mb-2"><i data-lucide="layout-dashboard" class="text-purple-800"></i></div>
                    <span>Feed Social</span>
                </div>
                <div onclick="abrirTela('tela-cotacao')" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-blue-400/30 p-3 rounded-full mb-2"><i data-lucide="calculator" class="text-blue-800"></i></div>
                    <span>Cotação</span>
                </div>
                <div onclick="abrirTela('tela-anotacoes')" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-yellow-400/30 p-3 rounded-full mb-2"><i data-lucide="sticky-note" class="text-yellow-800"></i></div>
                    <span>Notas</span>
                </div>
                <div onclick="abrirTela('tela-repique')" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-red-400/30 p-3 rounded-full mb-2"><i data-lucide="history" class="text-red-800"></i></div>
                    <span>Repique</span>
                </div>
                <div onclick="abrirTela('tela-carencia')" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-green-400/30 p-3 rounded-full mb-2"><i data-lucide="shield-check" class="text-green-800"></i></div>
                    <span>Carência</span>
                </div>
                <div onclick="abrirConfig()" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-gray-400/30 p-3 rounded-full mb-2"><i data-lucide="settings" class="text-gray-700"></i></div>
                    <span>Admin</span>
                </div>
            </div>

            <div class="glass-card p-6">
                <h3 class="font-black text-blue-900 mb-4 flex items-center gap-2"><i data-lucide="users"></i> EQUIPE ONLINE</h3>
                <div id="lista-equipe" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </section>

        <section id="tela-feed" class="hidden max-w-2xl mx-auto space-y-6">
            <button onclick="abrirTela('tela-menu')" class="flex items-center gap-2 text-blue-800 font-black px-4 py-2 glass-card inline-flex text-xs">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> VOLTAR AO MENU
            </button>
            
            <div class="glass-card p-6 space-y-4">
                <textarea id="feed-input" class="w-full bg-white/50 p-4 rounded-2xl outline-none font-medium text-sm border-none" placeholder="O que está acontecendo, Narry?"></textarea>
                <div class="flex justify-between items-center">
                    <label class="cursor-pointer flex items-center gap-2 text-[10px] font-black text-blue-700">
                        <i data-lucide="image" class="w-4 h-4"></i> ANEXAR FOTO
                        <input type="file" id="feed-img-input" class="hidden" accept="image/*">
                    </label>
                    <button onclick="postarNoFeed()" class="glossy bg-blue-600 text-white px-6 py-2 rounded-xl font-black text-xs uppercase">Postar</button>
                </div>
            </div>

            <div id="feed-container" class="space-y-4"></div>
        </section>

        <section id="tela-perfil" class="hidden max-w-md mx-auto py-10">
            <div class="glass-card p-10 text-center space-y-6">
                <div class="relative inline-block">
                    <img id="perfil-foto-view" src="https://via.placeholder.com/150" class="w-32 h-32 rounded-full border-4 border-white shadow-2xl object-cover">
                    <label for="perfil-upload" class="absolute bottom-0 right-0 bg-blue-600 text-white p-2 rounded-full cursor-pointer shadow-lg">
                        <i data-lucide="camera" class="w-4 h-4"></i>
                    </label>
                    <input type="file" id="perfil-upload" class="hidden" accept="image/*" onchange="atualizarFotoGlobal()">
                </div>
                <h2 id="perfil-nome" class="text-2xl font-black text-blue-900 leading-none"></h2>
                <p id="perfil-cargo" class="text-xs font-black text-blue-500 uppercase"></p>
                <button onclick="logout()" class="text-red-500 text-[10px] font-black uppercase tracking-widest mt-4">Sair da Conta</button>
                <button onclick="abrirTela('tela-menu')" class="block w-full mt-4 text-gray-500 text-[10px] font-black uppercase">Voltar</button>
            </div>
        </section>

        <section id="tela-anotacoes" class="hidden max-w-2xl mx-auto">
            <button onclick="abrirTela('tela-menu')" class="mb-4 flex items-center gap-2 text-blue-800 font-black px-4 py-2 glass-card inline-flex text-xs"><i data-lucide="arrow-left" class="w-4 h-4"></i> VOLTAR</button>
            <div class="glass-card p-6">
                <h2 class="text-xl font-black mb-4 text-blue-900">Bloco de Notas</h2>
                <textarea id="bloco-notas" oninput="salvarNotas()" class="w-full h-96 p-6 glass-card border-none outline-none font-medium text-blue-900" placeholder="Suas notas ficam salvas aqui..."></textarea>
            </div>
        </section>

        <section id="tela-cotacao" class="hidden">
             <button onclick="abrirTela('tela-menu')" class="mb-4 flex items-center gap-2 text-blue-800 font-black px-4 py-2 glass-card inline-flex text-xs"><i data-lucide="arrow-left" class="w-4 h-4"></i> VOLTAR</button>
             <div class="glass-card p-6">Sua estrutura de cotação aqui...</div>
        </section>

    </main>

    <div id="modal-config" class="hidden fixed inset-0 bg-blue-900/30 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm p-8 text-center">
            <h3 class="text-xl font-black mb-6 text-blue-900">Configurações</h3>
            <input type="text" id="input-destaque" class="w-full p-4 rounded-2xl mb-4 font-bold glass-card" placeholder="Nome do Funcionário do Mês">
            <button onclick="salvarConfig()" class="glossy w-full bg-blue-600 text-white py-4 rounded-2xl font-bold">SALVAR</button>
            <button onclick="fecharConfig()" class="w-full mt-2 text-gray-400 text-[10px] font-black uppercase">Fechar</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
