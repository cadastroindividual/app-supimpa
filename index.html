<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Supimpa 1.3 - Aero Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --fa-blue: #0078d7; --glass: rgba(255, 255, 255, 0.4); }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #d1f2fb 100%);
            background-attachment: fixed;
            color: #0b2e4d; min-height: 100vh;
        }
        .glossy {
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.2) 48%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.05) 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        }
        .card-menu { cursor: pointer; transition: all 0.3s ease; }
        .card-menu:hover { transform: translateY(-5px) scale(1.02); background: rgba(255,255,255,0.6); }
        
        /* Borda Dourada Animada para Funcionário do Mês */
        .gold-card {
            position: relative;
            background: rgba(255, 240, 180, 0.4);
            border: 2px solid #ffd700;
            overflow: hidden;
        }
        .gold-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, #ffd700);
            animation: rotate 4s linear infinite;
            z-index: -1;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .hidden { display: none !important; }
        #pdf-template { position: absolute; left: -9999px; }
        .profile-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
    </style>
</head>
<body class="flex flex-col">

    <section id="tela-login" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-gradient-to-br from-blue-300 to-blue-100">
        <div class="glass-card w-full max-w-md p-10 text-center space-y-6">
            <div class="inline-block glossy p-4 rounded-full mb-2">
                <i data-lucide="shield-check" class="w-10 h-10 text-blue-600"></i>
            </div>
            <h2 class="text-2xl font-black italic text-blue-900">Acesso Supimpa</h2>
            <div class="space-y-4">
                <input type="text" id="login-user" placeholder="Usuário" class="w-full p-4 rounded-2xl glass-card font-bold outline-none border-none">
                <input type="password" id="login-pass" placeholder="Senha" class="w-full p-4 rounded-2xl glass-card font-bold outline-none border-none">
                <button onclick="realizarLogin()" class="glossy w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-blue-700 transition-all">ENTRAR NO SISTEMA</button>
            </div>
            <p class="text-[10px] font-black text-blue-800/50 uppercase">Hapvida Health App v1.3</p>
        </div>
    </section>

    <header id="main-header" class="hidden glossy bg-[#0054a6] text-white py-4 px-6 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-xl font-extrabold italic drop-shadow-md">App Supimpa</h1>
            <p class="text-[8px] font-black uppercase tracking-widest">Aero Experience</p>
        </div>
        <div class="flex items-center gap-3 cursor-pointer" onclick="abrirTela('tela-perfil')">
            <div class="text-right">
                <p id="user-display-name" class="text-xs font-black leading-none">Carregando...</p>
                <p id="user-display-cargo" class="text-[9px] font-bold opacity-70 uppercase">Perfil</p>
            </div>
            <img id="user-display-img" src="https://via.placeholder.com/40" class="profile-img bg-white/20">
        </div>
    </header>

    <main id="main-content" class="hidden flex-1 max-w-6xl mx-auto w-full p-4">
        
        <section id="tela-menu" class="space-y-8">
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-center font-black uppercase text-[10px]">
                <div onclick="abrirTela('tela-cotacao')" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-blue-400/30 p-4 rounded-full mb-2"><i data-lucide="calculator" class="text-blue-800"></i></div>
                    <span>Cotação</span>
                </div>
                <div onclick="abrirTela('tela-repique')" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-red-400/30 p-4 rounded-full mb-2"><i data-lucide="history" class="text-red-800"></i></div>
                    <span>Repique</span>
                </div>
                <div onclick="abrirTela('tela-carencia')" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-green-400/30 p-4 rounded-full mb-2"><i data-lucide="shield-check" class="text-green-800"></i></div>
                    <span>Carência</span>
                </div>
                <div onclick="abrirTela('tela-anotacoes')" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-yellow-400/30 p-4 rounded-full mb-2"><i data-lucide="sticky-note" class="text-yellow-800"></i></div>
                    <span>Anotações</span>
                </div>
                <div onclick="abrirConfig()" class="glass-card card-menu p-4 flex flex-col items-center">
                    <div class="bg-gray-400/30 p-4 rounded-full mb-2"><i data-lucide="lock" class="text-gray-700"></i></div>
                    <span>Admin</span>
                </div>
            </div>

            <div class="glass-card p-6">
                <h3 class="font-black text-blue-900 mb-6 flex items-center gap-2 italic"><i data-lucide="users"></i> Equipe & Monitoramento</h3>
                <div id="lista-equipe" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>
            </div>
        </section>

        <section id="tela-perfil" class="hidden py-4">
            <button onclick="abrirTela('tela-menu')" class="mb-6 flex items-center gap-2 text-blue-800 font-black px-4 py-2 glass-card inline-flex">
                <i data-lucide="chevron-left"></i> VOLTAR
            </button>
            <div class="glass-card max-w-md mx-auto p-8 text-center space-y-6">
                <div class="relative inline-block">
                    <img id="perfil-foto-preview" src="https://via.placeholder.com/120" class="w-32 h-32 rounded-full border-4 border-white shadow-xl object-cover mx-auto">
                    <label for="input-foto" class="absolute bottom-0 right-0 bg-blue-600 text-white p-2 rounded-full cursor-pointer shadow-lg">
                        <i data-lucide="camera" class="w-4 h-4"></i>
                    </label>
                    <input type="file" id="input-foto" class="hidden" accept="image/*" onchange="uploadFoto()">
                </div>
                <div>
                    <h2 id="perfil-nome" class="text-2xl font-black text-blue-900">NOME DO USUÁRIO</h2>
                    <p id="perfil-cargo" class="text-xs font-bold text-blue-600 uppercase">CARGO DO USUÁRIO</p>
                </div>
                <div class="pt-4 border-t border-blue-900/10">
                    <button onclick="logout()" class="text-red-500 font-black uppercase text-xs">Sair da Conta</button>
                </div>
            </div>
        </section>

        <section id="tela-anotacoes" class="hidden py-4">
            <button onclick="abrirTela('tela-menu')" class="mb-6 flex items-center gap-2 text-blue-800 font-black px-4 py-2 glass-card inline-flex">
                <i data-lucide="chevron-left"></i> VOLTAR
            </button>
            <div class="glass-card p-6 max-w-2xl mx-auto">
                <h2 class="text-xl font-black mb-4 italic text-blue-900">Anotações</h2>
                <textarea id="bloco-notas" oninput="salvarNotas()" class="w-full h-80 p-6 glass-card border-none outline-none font-medium text-blue-900 placeholder:text-blue-900/30" placeholder="Escreva aqui suas anotações importantes..."></textarea>
                <p class="text-[9px] mt-2 font-black text-green-600 uppercase">Salvamento Automático Ativado</p>
            </div>
        </section>

        <section id="tela-cotacao" class="hidden">...</section>
        <section id="tela-carencia" class="hidden">...</section>
        <section id="tela-repique" class="hidden">...</section>

    </main>

    <div id="modal-config" class="hidden fixed inset-0 bg-blue-900/30 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm p-8">
            <h3 class="text-xl font-black mb-6 text-blue-900 italic text-center">Definir Funcionário do Mês</h3>
            <input type="text" id="input-destaque" class="w-full p-4 rounded-2xl mb-4 font-bold" placeholder="Ex: Cleide Tavares">
            <button onclick="salvarConfig()" class="glossy w-full bg-blue-600 text-white py-4 rounded-2xl font-bold">DEFINIR</button>
            <button onclick="fecharConfig()" class="w-full mt-2 text-gray-500 text-[10px] font-black uppercase">Fechar</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
