<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPIMPA 3.0 - Frutiger Aero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --glass: rgba(255, 255, 255, 0.45);
            --bg-primary: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #d1f2fb 100%);
            --text-primary: #0b2e4d;
            --card-bg: rgba(255, 255, 255, 0.45);
        }
        
        [data-theme="dark"] {
            --glass: rgba(30, 41, 59, 0.6);
            --bg-primary: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            --text-primary: #e2e8f0;
            --card-bg: rgba(30, 41, 59, 0.6);
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-primary);
            background-attachment: fixed; 
            color: var(--text-primary); 
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .glossy {
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.1) 50%, rgba(0,0,0,0.05) 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            transition: all 0.3s ease;
        }
        
        .glass-card {
            background: var(--card-bg); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 24px;
            transition: all 0.3s ease;
        }
        
        [data-theme="dark"] .glass-card { border-color: rgba(100, 116, 139, 0.3); }
        
        @keyframes glow-gold { 
            0%, 100% { box-shadow: 0 0 20px #ffd700, 0 0 30px #ffd700; border-color: #ffd700; } 
            50% { box-shadow: 0 0 40px #ffd700, 0 0 60px #ffd700; border-color: #fff; } 
        }
        
        .card-f-mes { 
            animation: glow-gold 2s infinite; 
            border: 3px solid #ffd700 !important; 
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05)) !important;
            position: relative;
        }
        
        .card-f-mes::before {
            content: '⭐ FUNCIONÁRIO DO MÊS ⭐';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            color: #000;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1px;
            box-shadow: 0 2px 10px rgba(255,215,0,0.5);
        }
        
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 15px rgba(34,197,94,0.6); }
            50% { box-shadow: 0 0 30px rgba(34,197,94,0.9); }
        }
        
        .chat-unread {
            background: linear-gradient(135deg, rgba(34,197,94,0.25), rgba(34,197,94,0.1)) !important;
            border: 2px solid #22c55e !important;
            animation: pulse-green 2s infinite;
        }
        
        .badge-lendario {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            animation: shine 2s infinite;
            box-shadow: 0 4px 20px rgba(255,215,0,0.6);
        }
        
        @keyframes shine { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
        
        .badge-raro { background: linear-gradient(135deg, #9333ea, #a855f7); box-shadow: 0 4px 15px rgba(147,51,234,0.5); }
        .badge-comum { background: linear-gradient(135deg, #3b82f6, #60a5fa); box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
        
        .xp-bar { height: 6px; background: rgba(0,0,0,0.2); border-radius: 999px; overflow: hidden; }
        .xp-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899); border-radius: 999px; transition: width 0.5s ease; }
        
        .notif-badge {
            position: absolute; top: -8px; right: -8px; background: #ef4444; color: white;
            border-radius: 999px; padding: 2px 6px; font-size: 10px; font-weight: 800;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .reaction-btn { transition: all 0.2s ease; cursor: pointer; }
        .reaction-btn:hover { transform: scale(1.2); }
        .reaction-btn.active { animation: bounce 0.5s; }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        
        .chat-bubble { max-width: 70%; word-wrap: break-word; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .theme-toggle { position: relative; width: 60px; height: 30px; background: rgba(255,255,255,0.3); border-radius: 999px; cursor: pointer; transition: all 0.3s; }
        .theme-toggle-slider { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; background: white; border-radius: 999px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        [data-theme="dark"] .theme-toggle { background: rgba(100,116,139,0.5); }
        [data-theme="dark"] .theme-toggle-slider { left: 33px; background: #1e293b; }
        
        .status-humor { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .status-focado { background: linear-gradient(135deg, #10b981, #34d399); color: white; }
        .status-disponivel { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: white; }
        .status-sobrevivencia { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: white; }
        .status-18h { background: linear-gradient(135deg, #ef4444, #f87171); color: white; }
        
        .setor-badge { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; color: #3b82f6; }
        [data-theme="dark"] .setor-badge { background: rgba(59, 130, 246, 0.25); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col" data-theme="light">

    <!-- Login -->
    <section id="tela-login" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-blue-400/20 backdrop-blur-3xl">
        <div class="glass-card w-full max-w-md p-10 text-center space-y-6">
            <div class="text-6xl mb-4">🏥</div>
            <h2 class="text-3xl font-black italic drop-shadow-sm">Faça o login</h2>
            <div class="space-y-4">
                <input type="text" id="login-user" placeholder="Email ou usuário" class="w-full p-4 rounded-2xl glass-card outline-none font-bold">
                <input type="password" id="login-pass" placeholder="Senha" class="w-full p-4 rounded-2xl glass-card outline-none font-bold">
                <button onclick="realizarLogin()" class="glossy w-full bg-blue-600 text-white font-black py-4 rounded-2xl hover:scale-105 transition-all">ENTRAR</button>
                <button onclick="esqueceuSenha()" class="w-full text-xs font-bold opacity-70 hover:opacity-100 transition-all">Esqueceu a senha?</button>
            </div>
        </div>
    </section>

    <!-- Header -->
    <header id="main-header" class="hidden glossy bg-[#0054a6] text-white h-[60px] px-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="text-sm font-black">Bem-vindo(a), <span id="welcome-name">...</span></div>
        </div>
        
        <div class="flex items-center gap-3">
            <button id="btn-checkin" onclick="fazerCheckin()" class="hidden text-xs font-bold bg-green-500 hover:bg-green-600 px-3 py-1 rounded-lg">✓ Check-in</button>
            
            <div class="relative cursor-pointer" onclick="toggleNotificacoes()">
                <i data-lucide="bell" class="w-5 h-5"></i>
                <span id="notif-badge" class="notif-badge hidden">0</span>
            </div>
            
            <div class="relative cursor-pointer" onclick="abrirListaChat()">
                <i data-lucide="message-circle" class="w-5 h-5"></i>
                <span id="chat-badge" class="notif-badge hidden">0</span>
            </div>
            
            <div class="theme-toggle" onclick="toggleTheme()">
                <div class="theme-toggle-slider"><i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i></div>
            </div>
            
            <div class="flex items-center gap-2 cursor-pointer" onclick="verMeuPerfil()">
                <p id="nav-xp" class="text-[9px] font-black text-blue-200 hidden sm:block"></p>
                <img id="nav-img" src="" class="w-9 h-9 rounded-full border-2 border-white/50 object-cover">
            </div>
        </div>
    </header>

    <main id="main-content" class="hidden flex-1 p-4 max-w-6xl mx-auto w-full space-y-6">
        
        <!-- Menu Hub -->
        <section id="tela-menu" class="space-y-6">
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-center uppercase text-[8px] font-black">
                <div onclick="abrirFeed()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="layout" class="mx-auto mb-1 text-purple-600 w-6 h-6"></i> Feed Social
                </div>
                <div onclick="abrirCotacao()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="calculator" class="mx-auto mb-1 text-blue-600 w-6 h-6"></i> Cotação
                </div>
                <div onclick="abrirCarencia()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="shield-check" class="mx-auto mb-1 text-green-600 w-6 h-6"></i> Carência
                </div>
                <div onclick="abrirRepique()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="refresh-cw" class="mx-auto mb-1 text-orange-600 w-6 h-6"></i> Repique
                </div>
                <div onclick="abrirBadges()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="award" class="mx-auto mb-1 text-yellow-600 w-6 h-6"></i> Badges
                </div>
                <div onclick="abrirAnotacoes()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="sticky-note" class="mx-auto mb-1 text-pink-600 w-6 h-6"></i> Anotações
                </div>
                <div onclick="abrirScripts()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="file-text" class="mx-auto mb-1 text-indigo-600 w-6 h-6"></i> Scripts
                </div>
                <div onclick="abrirCalendario()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="calendar" class="mx-auto mb-1 text-red-600 w-6 h-6"></i> Calendário
                </div>
                <div onclick="abrirChatbot()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="bot" class="mx-auto mb-1 text-cyan-600 w-6 h-6"></i> Chatbot
                </div>
                <div onclick="tentarAcessoAdmin()" class="glass-card p-4 cursor-pointer hover:scale-105 transition-all">
                    <i data-lucide="lock" class="mx-auto mb-1 text-gray-700 w-6 h-6"></i> Admin
                </div>
            </div>

            <!-- Ranking -->
            <div class="glass-card p-5">
                <h3 class="font-black mb-4 flex items-center gap-2 text-sm uppercase italic">
                    <i data-lucide="trophy" class="text-yellow-500"></i> Ranking do Mês
                </h3>
                <div id="lista-equipe" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            </div>
        </section>

        <!-- Feed -->
        <section id="tela-feed" class="hidden max-w-2xl mx-auto space-y-4 pb-20">
            <button onclick="abrirTela('tela-menu')" class="text-xs font-bold text-blue-600">← Voltar</button>
            
            <div class="glass-card p-4 space-y-3">
                <div class="flex gap-3">
                    <img id="post-user-img" src="" class="w-10 h-10 rounded-full object-cover border-2 border-white/50">
                    <textarea id="feed-text" class="flex-1 bg-white/30 p-3 rounded-xl outline-none text-sm min-h-[80px]" placeholder="O que você está pensando? Use @ para mencionar..."></textarea>
                </div>
                <div class="flex justify-between items-center">
                    <div class="flex gap-2">
                        <input type="file" id="feed-media" class="hidden" accept="image/*" onchange="previewMedia(this)">
                        <button onclick="document.getElementById('feed-media').click()" class="p-2 bg-white/40 rounded-lg text-blue-600 hover:bg-white/60">
                            <i data-lucide="image" class="w-5 h-5"></i>
                        </button>
                        <button onclick="criarEnquete()" class="p-2 bg-white/40 rounded-lg text-purple-600 hover:bg-white/60">
                            <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <button onclick="postarFeed()" class="glossy bg-blue-600 text-white px-6 py-2 rounded-xl font-black text-xs uppercase hover:scale-105">PUBLICAR</button>
                </div>
                <div id="media-preview" class="hidden relative w-24 h-24 rounded-lg overflow-hidden border-2 border-blue-200">
                    <img id="img-preview" src="" class="w-full h-full object-cover">
                    <button onclick="removerMedia()" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
            </div>
            
            <div id="feed-posts" class="space-y-6"></div>
        </section>

    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
